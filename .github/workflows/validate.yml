name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The installer lists the skill
        run: |
          npx -y skills add . --list 2>&1 | tee skills-list.txt
          grep -q 'reuse-before-write' skills-list.txt
      - name: Folder name matches the frontmatter name
        run: |
          for d in skills/*/; do
            n=$(basename "$d")
            grep -q "^name: $n$" "$d/SKILL.md" || { echo "::error::$d/SKILL.md name is not $n"; exit 1; }
          done
          test ! -f SKILL.md || { echo "::error::no SKILL.md at the repository root"; exit 1; }
      - name: Shell scripts
        run: |
          for f in skills/*/scripts/*.sh evals/run.sh; do bash -n "$f"; done
          shellcheck -x -s bash skills/*/scripts/*.sh evals/run.sh
      - name: Scripts smoke test
        run: |
          cd evals/fixtures/1-ts-reuse-format-currency
          git init -q && git add -A && git -c user.name=ci -c user.email=ci@localhost commit -qm fixture
          bash ../../../skills/reuse-before-write/scripts/find-similar.sh currency | grep -q formatCurrency
          echo 'export const toDollars = (n: number) => { try { return "$" + n } catch (e) {} };' > src/utils/dollars.ts
          bash ../../../skills/reuse-before-write/scripts/audit-diff.sh | tee audit.txt
          grep -q 'RED' audit.txt
