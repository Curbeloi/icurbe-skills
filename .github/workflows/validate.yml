name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none
      - name: The installer lists the skill
        run: |
          npx -y skills add . --list 2>&1 | tee skills-list.txt
          grep -q 'reuse-before-write' skills-list.txt
      - name: Folder name matches the frontmatter name
        run: |
          for d in skills/*/; do
            n=$(basename "$d")
            grep -q "^name: $n$" "$d/SKILL.md" || { echo "::error::$d/SKILL.md name is not $n"; exit 1; }
          done
          test ! -f SKILL.md || { echo "::error::no SKILL.md at the repository root"; exit 1; }
      - name: Shell scripts
        run: |
          for f in skills/*/scripts/*.sh evals/*.sh evals/checks/*.sh tests/*.sh tests/cases/*.sh; do bash -n "$f"; done
          shellcheck -x -s bash skills/*/scripts/*.sh evals/*.sh evals/checks/*.sh tests/*.sh tests/cases/*.sh
      - name: Regression tests (audit and eval checks on the fixtures)
        run: bash tests/run.sh
